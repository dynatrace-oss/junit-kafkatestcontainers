name: Create Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-M[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-RC[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run check version
        id: version
        run: bash ./scripts/check-version.sh
        env:
          TAG: ${{ github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Create artifact
        run: ./gradlew createRepoForUploadToMavenCentral
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: ./build/mavencentral/junit-kafkatestcontainers-${{ steps.version.outputs.version }}.zip
          name: ${{ steps.version.outputs.title }}
          make_latest: ${{ steps.version.outputs.release }}
          prerelease: ${{ steps.version.outputs.release == 'false' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
